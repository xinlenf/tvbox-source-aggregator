name = "tvbox-source-aggregator"
main = "src/cf-entry.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# 自定义域名（可选，推荐配置）
# 取消注释并替换为你自己的域名和 Zone ID
# routes = [
#   { pattern = "tv.fanqiedaohanfei.top/*", zone_id = "2413cfd619028f9c317a8c286fd77722" }
# ]

[triggers]
crons = ["0 * * * *"]  # 每小时触发，实际执行频率由 Admin 设置的聚合间隔控制

[[kv_namespaces]]
binding = "KV"
id = "5008ecf952754c19b15bd9ced2398e67"
preview_id = "5008ecf952754c19b15bd9ced2398e67"

[vars]
# 其他原有变量保持不变
ADMIN_TOKEN = ""  # 这里写你想要的密码，纯数字最保险
SPEED_TIMEOUT_MS = "5000"   # 源地址延迟阈值（毫秒）
SITE_TIMEOUT_MS = "3000"    # 站点 API 延迟阈值（毫秒）
FETCH_TIMEOUT_MS = "5000"   # 抓取配置 JSON 超时（毫秒）
WORKER_BASE_URL = "https://tv.fanqiedaohanfei.top"  # CF 边缘代理依赖此配置（JAR/MacCMS/直播源代理）
